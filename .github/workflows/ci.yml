name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Configs & Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configs
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f services/searxng/docker-compose.yml config -q

      - name: Check Shell Scripts Syntax
        run: |
          bash -n manage.sh services/firecrawl/setup.sh services/firecrawl/run.sh

      - name: Run ShellCheck
        run: |
          shellcheck manage.sh services/firecrawl/setup.sh services/firecrawl/run.sh

      - name: Validate YAML Syntax
        run: |
          python3 -c "
          import yaml
          files = [
              'config.yaml.example',
              'services/searxng/searxng/settings.yml',
              '.github/workflows/ci.yml',
              '.github/dependabot.yml',
              'docker-compose.yml',
              'docker-compose.build.yml',
              'services/searxng/docker-compose.yml'
          ]
          for f in files:
              with open(f, 'r') as fp:
                  yaml.safe_load(fp)
          print('All YAML files are valid.')
          "

  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source=. -v

  vulnerability-scan:
    name: Vulnerability & Misconfig Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability & misconfig scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Run Trivy SARIF generation
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
