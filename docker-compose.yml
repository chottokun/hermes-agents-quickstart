services:
  gateway:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    image: hermes-agent:local
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    working_dir: /workspace
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=127.0.0.1
    command: ["gateway", "run"]

  # 対話型CLIやセットアップ用のサービス（docker compose run --rm cli などの手動時のみ起動）
  cli:
    profiles: ["cli"]
    image: hermes-agent:local
    working_dir: /workspace
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: ["hermes"]
