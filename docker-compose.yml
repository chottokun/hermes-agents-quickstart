x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  agent_internal:
    driver: bridge
    name: mi_hermes_internal

services:
  # ----------------------------------------------------
  # 1. Web Dashboard & Gateway (WebUIのみホストループバックへ公開)
  # ----------------------------------------------------
  gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    networks:
      - agent_internal
    ports:
      # 外部公開は WebUI (9119) のみ。127.0.0.1縛りでLAN露出を完全遮断
      - "127.0.0.1:9119:9119"
    expose:
      # 内部API (8642) はコンテナ間通信のみに制限
      - "8642"
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://firecrawl:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-fc-local-key}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
    # s6-overlay のユーザーリマップ・降格に必要な最小特権のみ許可し、ネットワーク特権等は完全ドロップ
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["gateway", "run"]

  # ----------------------------------------------------
  # 2. CLI / TUI（初期セットアップおよび対話用）
  # ----------------------------------------------------
  cli:
    profiles: ["cli"]
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    working_dir: /workspace
    networks:
      - agent_internal
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://firecrawl:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-fc-local-key}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["hermes"]

  # ----------------------------------------------------
  # 3. 軽量メタ検索エンジン（SearXNG: 内部ネットワーク専用）
  # ----------------------------------------------------
  searxng:
    profiles: ["search", "full"]
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./services/searxng/searxng:/etc/searxng:ro
    networks:
      - agent_internal
    expose:
      - "8080"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-ultrasecretkey_please_change_in_production}
      - FORCE_OWNERSHIP=false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
